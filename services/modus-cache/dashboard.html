<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Modus Object Cache</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "Cascadia Code", "SFMono-Regular", monospace;
        background: #10140f;
        color: #e8eedf;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: clamp(1.5rem, 5vw, 5rem);
        place-items: center;
      }

      main {
        width: min(52rem, 100%);
      }

      header {
        border-bottom: 1px solid #52604a;
        margin-bottom: 2rem;
        padding-bottom: 1.25rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        color: #b8f397;
        font-size: clamp(1.8rem, 5vw, 3.5rem);
        font-weight: 500;
        letter-spacing: -0.06em;
      }

      p {
        color: #aeb8a5;
        line-height: 1.6;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
      }

      .status::before {
        width: 0.65rem;
        height: 0.65rem;
        border-radius: 50%;
        background: #d7c787;
        box-shadow: 0 0 1rem #d7c787;
        content: "";
      }

      .status[data-state="active"]::before {
        background: #b8f397;
        box-shadow: 0 0 1rem #b8f397;
      }

      .status[data-state="error"]::before {
        background: #f28b82;
        box-shadow: 0 0 1rem #f28b82;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid #384132;
        background: #384132;
      }

      article {
        min-height: 7rem;
        padding: 1.25rem;
        background: #171c15;
      }

      article span {
        display: block;
        margin-bottom: 0.8rem;
        color: #7f8b76;
        font-size: 0.75rem;
        text-transform: uppercase;
      }

      article strong {
        color: #f4f7ef;
        font-size: 1.35rem;
        font-weight: 500;
      }

      code {
        overflow-wrap: anywhere;
        color: #d7c787;
      }

      footer {
        margin-top: 1.5rem;
        font-size: 0.8rem;
      }

      a {
        color: #b8f397;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Modus Object Cache</h1>
        <p class="status" id="status">Loading status</p>
      </header>

      <section class="grid">
        <article>
          <span>Objects</span>
          <strong id="objects">-</strong>
        </article>
        <article>
          <span>Realisations</span>
          <strong id="realisations">-</strong>
        </article>
        <article>
          <span>Cache size</span>
          <strong id="cache-size">-</strong>
        </article>
        <article>
          <span>Disk available</span>
          <strong id="available">-</strong>
        </article>
        <article>
          <span>Filesystem use</span>
          <strong id="percent">-</strong>
        </article>
        <article>
          <span>Last update</span>
          <strong id="updated">-</strong>
        </article>
      </section>

      <p>Protocol endpoint: <code id="endpoint">cache.modus.froment.software:5010</code></p>
      <p>Wire framing: <code id="protocol">MOCQ/MOCR</code> over TCP</p>

      <footer>
        <a href="/status.json">status.json</a>
      </footer>
    </main>

    <script>
      const formatBytes = (bytes) => {
        const units = [
          ["gigabyte", 1_000_000_000],
          ["megabyte", 1_000_000],
          ["kilobyte", 1_000],
        ];
        for (const [unit, threshold] of units) {
          if (bytes >= threshold) {
            return new Intl.NumberFormat(undefined, {
              style: "unit",
              unit,
              maximumFractionDigits: 1,
            }).format(bytes / threshold);
          }
        }
        return new Intl.NumberFormat(undefined, {
          style: "unit",
          unit: "byte",
          maximumFractionDigits: 0,
        }).format(bytes);
      };

      const formatCount = (count) => new Intl.NumberFormat().format(count);

      fetch("/status.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return response.json();
        })
        .then((data) => {
          const status = document.querySelector("#status");
          status.textContent = `Cache ${data.service}`;
          status.dataset.state = data.service === "active" ? "active" : "error";
          document.querySelector("#objects").textContent = formatCount(data.objectCount);
          document.querySelector("#realisations").textContent = formatCount(data.realisationCount);
          document.querySelector("#cache-size").textContent = formatBytes(data.cacheBytes);
          document.querySelector("#available").textContent = formatBytes(data.availableBytes);
          document.querySelector("#percent").textContent = data.usedPercent;
          document.querySelector("#updated").textContent = new Date(data.updatedAt).toLocaleString();
          document.querySelector("#endpoint").textContent = data.endpoint;
          document.querySelector("#protocol").textContent = data.protocol;
        })
        .catch(() => {
          const status = document.querySelector("#status");
          status.textContent = "Status unavailable";
          status.dataset.state = "error";
        });
    </script>
  </body>
</html>
