name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: homelab-system
  cancel-in-progress: true

jobs:
  build-homelab:
    name: Build homelab system
    runs-on:
      - self-hosted
      - nixos
      - homelab
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build system
        run: |
          mkdir -p "$HOME/gcroots"
          nix build \
            "path:$PWD#nixosConfigurations.homelab.config.system.build.toplevel" \
            --out-link "$HOME/gcroots/homelab-system"
