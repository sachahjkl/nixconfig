name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: homelab-system
  cancel-in-progress: true

jobs:
  build-systems:
    name: Build all NixOS systems
    runs-on:
      - self-hosted
      - nixos
      - homelab
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build systems
        run: |
          mkdir -p "$HOME/gcroots"
          nix eval --raw "path:$PWD#nixosConfigurations" \
            --apply 'configs: builtins.concatStringsSep "\n" (builtins.attrNames configs) + "\n"' |
            while IFS= read -r host; do
              nix build \
                "path:$PWD#nixosConfigurations.$host.config.system.build.toplevel" \
                --out-link "$HOME/gcroots/$host-system"
            done
